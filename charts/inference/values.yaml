namespace: lang-learn

model:
  version: "gemma-4-e4b-q5-2026-07-28"

# ---------------------------------------------------------------------------
# MinIO (DVC remote object store)
# ---------------------------------------------------------------------------
minio:
  enabled: true
  fullnameOverride: "lang-learn-minio"

  rootUser: minioadmin
  rootPassword: minioadmin

  mode: standalone

  persistence:
    enabled: true
    size: 30Gi
    storageClass: "microk8s-hostpath"

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m

  buckets:
    - name: dvc-store
      policy: none
      purge: false

  service:
    type: ClusterIP
    port: 9000

  consoleService:
    type: ClusterIP
    port: 9001

  metrics:
    serviceMonitor:
      enabled: false

# ---------------------------------------------------------------------------
# Inference (KServe)
# ---------------------------------------------------------------------------
inference:
  image:
    repository: ghcr.io/rickdevma100/inference
    tag: latest
    pullPolicy: Always

  minReplicas: 1
  maxReplicas: 2

  scaleTarget: 1

  model:
    path: /app/models/gemma-q4/google_gemma-4-E2B-it-Q4_K_M.gguf
    dtype: bfloat16
    quantization: none
    useFlashAttention: true

  nThreads: 4

  resources:
    requests:
      memory: "4Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  ingressClassName: public
  inferenceHost: inference.langlearn.local

# ---------------------------------------------------------------------------
# Prompts (inlined for ConfigMap)
# ---------------------------------------------------------------------------
prompts:
  image_describe: |
    You are a German language tutor.
    Describe the image in simple German.
    Use A1 vocabulary.
    Explain difficult words in English.
  scenario_dialogue: |
    Generate a natural German conversation between exactly two people, including their English translations.

    Requirements:
    - Alternate clearly between Person A and Person B.
    - For each turn, write the German sentence first, followed immediately by its English translation on the next line starting with "Translation: ".
    - Each dialogue turn must contain at least 7 words.
    - The conversation must contain at least 18 conversational turns in total (9 turns for Person A and 9 turns for Person B).
    - Ensure the dialogue is detailed, meeting the 18-turn requirement before stopping.
    - Use simple and natural German suitable for A1-A2 level learners.
    - The dialogue should sound realistic and practical for daily life situations.
    - Keep the grammar simple and beginner-friendly.
    - Do not include explanations, notes, titles, or formatting symbols.
    - Do NOT number the turns. Do NOT put numbers before Person A or Person B.

    Specific Scenario for this conversation:
    {scenario}

    Start the conversation now:
    Person A:

  explain_word: |
    You are a German language expert. Explain the German word "{word}" for a beginner learner.

    Respond with ONLY a JSON object. Do NOT wrap it in code blocks. Do NOT add any text before or after the JSON.

    The JSON must have these fields:
    - "word": the German word
    - "part_of_speech": part of speech (include gender for nouns, e.g. "noun (feminine)")
    - "meaning": English translation and brief explanation
    - "example_sentence_german": a simple A1-A2 level German sentence using the word
    - "example_sentence_english": English translation of that sentence
    - "synonyms": array of objects with "word" (German) and "english" (English) keys, 2-3 items

    Example output format:
    {{"word": "Hund", "part_of_speech": "noun (masculine)", "meaning": "dog - a common pet animal", "example_sentence_german": "Der Hund spielt im Garten.", "example_sentence_english": "The dog plays in the garden.", "synonyms": [{{"word": "Tier", "english": "animal"}}, {{"word": "Welpe", "english": "puppy"}}]}}

    Now explain the word "{word}":

  practice_check: |
    You are a German language tutor checking a student's practice answer.

    The student is practising an {level}-level German dialogue about: "{scenario}".
    The student is writing as {speaker}.

    CONVERSATION CONTEXT (the lines just before the student's turn):
    ---
    {preceding_context}
    ---

    The EXPECTED MEANING of the student's line (in English):
    "{expected_english}"

    The STUDENT WROTE (in German):
    "{user_text}"

    Your job:
    1. Is the student's German sentence GRAMMATICALLY CORRECT for {level}-level German?
    2. Does the student's sentence FIT THE CONVERSATION CONTEXT and match the expected meaning?

    IMPORTANT RULES:
    - The student does NOT need to write the exact same sentence as the original. Any German sentence that conveys the same or very similar meaning is CORRECT.
    - Accept synonyms, alternative phrasings, and different word order if the meaning is preserved.
    - For A1-A2 level, do NOT flag informal/formal register differences as errors unless it changes the meaning.
    - Simple spelling mistakes in German (like missing umlauts) should be noted gently but not marked as grammar_ok=false.
    - If the sentence is grammatically correct and on-topic, ALWAYS return grammar_ok=true and on_topic=true. Do NOT be overly strict.

    Respond with ONLY a JSON object. No markdown, no ```, no explanation outside the JSON.
    The JSON must have exactly these fields:
    - "grammar_ok": true if the German is grammatically acceptable, false only for clear grammar errors
    - "on_topic": true if the sentence fits the conversation context and expected meaning, false only if completely unrelated
    - "feedback": a short, encouraging explanation in simple English. If correct, say "Perfect!" or praise the student. If there's an error, explain what's wrong and show the correction. Maximum 2 sentences.
    - "corrected_text": the corrected German sentence ONLY if grammar_ok is false. Set to null if grammar_ok is true.
    - "score": a number from 0.0 to 1.0. Use 1.0 for perfect, 0.8 for minor issues, 0.5 for grammar errors, 0.3 for off-topic.

    Output the JSON now:

  exam_eval_schreiben: |
    You are an official Goethe-Institut certified examiner evaluating a student's German writing exam (Goethe-Zertifikat A2 Schreiben).

    Evaluate the following submission strictly according to the official Goethe A2 evaluation criteria:

    CRITERIA:
    1. Aufgabenerfüllung (Task Fulfillment - 0 to 10 points):
       - Band A (9-10 pts): All Leitpunkte/bullet points addressed clearly and appropriately; appropriate length and format.
       - Band B (7-8 pts): Most points addressed well; minor omissions.
       - Band C (5-6 pts): Points only partially addressed or noticeable lack of clarity.
       - Band D (3-4 pts): Only 1 point addressed or mostly off-topic.
       - Band E (0-2 pts): Topic missed completely or incomprehensible.

    2. Sprache / Beherrschung (Grammar, Vocabulary & Coherence - 0 to 15 points):
       - Band A (13-15 pts): Good range of A2 vocabulary and structures; few minor grammatical or orthographical errors that do not hinder understanding.
       - Band B (10-12 pts): Adequate A2 structures; some errors in verb placement/endings/articles, but meaning is clear.
       - Band C (7-9 pts): Limited vocabulary; frequent errors that sometimes impair comprehension.
       - Band D (4-6 pts): Very simple or repetitive structures; heavy errors causing severe impairment.
       - Band E (0-3 pts): Severe and persistent errors; largely unintelligible.

    TASK PROMPT:
    Teil 1 Prompt: {teil1_prompt}
    Student Teil 1 Text:
    """
    {teil1_user_text}
    """

    Teil 2 Prompt: {teil2_prompt}
    Student Teil 2 Text:
    """
    {teil2_user_text}
    """

    Provide your evaluation as a strict JSON object matching this schema:
    {{
      "overall_score": 21.5,
      "max_score": 25.0,
      "passed": true,
      "teil1": {{
        "task_fulfillment_score": 4.5,
        "task_fulfillment_max": 5.0,
        "task_fulfillment_band": "A",
        "language_score": 6.5,
        "language_max": 7.5,
        "language_band": "B",
        "total_score": 11.0,
        "word_count": 28,
        "feedback": "Clear message addressing all points with proper informal greeting.",
        "corrections": [
          {{
            "original": "Ich komme spät weil der Bus ist kaputt.",
            "corrected": "Ich komme spät, weil der Bus kaputt ist.",
            "explanation": "Subordinate clause with 'weil' puts the conjugated verb 'ist' at the very end."
          }}
        ],
        "model_answer": "Lieber Michael, entschuldige bitte, dass ich heute 20 Minuten zu spät komme. Mein Zug hatte Verspätung. Können wir uns um 18:30 Uhr direkt vor dem Kino treffen? Bis gleich! Viele Grüße"
      }},
      "teil2": {{
        "task_fulfillment_score": 4.5,
        "task_fulfillment_max": 5.0,
        "task_fulfillment_band": "A",
        "language_score": 6.0,
        "language_max": 7.5,
        "language_band": "B",
        "total_score": 10.5,
        "word_count": 36,
        "feedback": "Polite formal tone, all four points covered adequately.",
        "corrections": [
          {{
            "original": "Können Sie mich Information schicken?",
            "corrected": "Könnten Sie mir bitte Informationen schicken?",
            "explanation": "Use dative 'mir' and plural 'Informationen' for polite requests."
          }}
        ],
        "model_answer": "Sehr geehrte Frau Weber, ich möchte im Juli gerne den Deutschkurs B1 an Ihrer Sprachschule besuchen. Wann beginnt der nächste Kurs und wie viel kostet er? Haben Sie auch Unterkünfte? Vielen Dank und freundliche Grüße"
      }},
      "general_feedback": "Overall strong A2 performance. Work on subordinate clause word order with 'weil' and 'dass'."
    }}

  exam_schreiben_teil1: |
    You are creating official Goethe-Zertifikat A2 Writing Exam (Schreiben Teil 1) materials.
    Generate a short SMS/note writing task with 3 bullet points (~20-30 words).
    Return ONLY a valid JSON object without markdown fences:
    {
      "teil": 1,
      "title": "Schreiben Teil 1: Kurze Mitteilung",
      "scenario_german": "Situation in German...",
      "instructions_german": "Schreiben Sie eine kurze Nachricht (ca. 20–30 Wörter). Schreiben Sie zu allen drei Punkten:",
      "bullet_points": [
        "Point 1 in German",
        "Point 2 in German",
        "Point 3 in German"
      ],
      "target_word_count": "20–30 Wörter",
      "tips_english": "Write a short note (approx. 20-30 words) addressing all 3 points."
    }

  exam_schreiben_teil2: |
    You are creating official Goethe-Zertifikat A2 Writing Exam (Schreiben Teil 2) materials.
    Generate a formal/semi-formal email writing task with 4 bullet points (~30-40 words).
    Return ONLY a valid JSON object without markdown fences:
    {
      "teil": 2,
      "title": "Schreiben Teil 2: Formelle E-Mail",
      "scenario_german": "Situation in German...",
      "instructions_german": "Schreiben Sie eine E-Mail (ca. 30–40 Wörter). Schreiben Sie zu allen vier Punkten:",
      "bullet_points": [
        "Point 1 in German",
        "Point 2 in German",
        "Point 3 in German",
        "Point 4 in German"
      ],
      "target_word_count": "30–40 Wörter",
      "tips_english": "Write a formal email (approx. 30-40 words) addressing all 4 points with formal greeting and sign-off."
    }

  exam_lesen_teil1: |
    You are creating official Goethe-Zertifikat A2 Reading Exam (Lesen Teil 1) materials.
    Generate a concise A2 German newspaper article (60-80 words) with 5 multiple-choice questions (options a, b, c).
    Return ONLY a valid JSON object without markdown fences:
    {
      "title": "German Article Title",
      "text": "Full article text in German (60-80 words)...",
      "items": [
        {"id": 1, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "a", "explanation": "Short reason"},
        {"id": 2, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "b", "explanation": "Short reason"},
        {"id": 3, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "c", "explanation": "Short reason"},
        {"id": 4, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "a", "explanation": "Short reason"},
        {"id": 5, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "b", "explanation": "Short reason"}
      ]
    }

  exam_lesen_teil2: |
    You are creating official Goethe-Zertifikat A2 Reading Exam (Lesen Teil 2) materials.
    Generate a shopping directory with 4-5 floors and 5 situational questions (numbered 6 to 10) with options a, b, c.
    Return ONLY a valid JSON object without markdown fences:
    {
      "title": "Kaufhaus-Wegweiser",
      "directory": [
        {"floor": "2. Stock", "departments": "Kinderkleidung, Sportartikel"},
        {"floor": "1. Stock", "departments": "Damen- und Herrenmode, Schuhe"},
        {"floor": "Erdgeschoss", "departments": "Parfümerie, Uhren, Schmuck"},
        {"floor": "Untergeschoss", "departments": "Lebensmittel, Haushaltswaren"}
      ],
      "items": [
        {"id": 6, "question": "Customer need in German?", "options": {"a": "1. Stock", "b": "2. Stock", "c": "Anderes Stockwerk"}, "answer_key": "b", "explanation": "Short reason"},
        {"id": 7, "question": "Customer need in German?", "options": {"a": "Erdgeschoss", "b": "1. Stock", "c": "Untergeschoss"}, "answer_key": "a", "explanation": "Short reason"},
        {"id": 8, "question": "Customer need in German?", "options": {"a": "Untergeschoss", "b": "2. Stock", "c": "1. Stock"}, "answer_key": "a", "explanation": "Short reason"},
        {"id": 9, "question": "Customer need in German?", "options": {"a": "1. Stock", "b": "Erdgeschoss", "c": "Anderes Stockwerk"}, "answer_key": "b", "explanation": "Short reason"},
        {"id": 10, "question": "Customer need in German?", "options": {"a": "2. Stock", "b": "1. Stock", "c": "Untergeschoss"}, "answer_key": "c", "explanation": "Short reason"}
      ]
    }

  exam_lesen_teil3: |
    You are creating official Goethe-Zertifikat A2 Reading Exam (Lesen Teil 3) materials.
    Generate a concise personal email (60-80 words) with 5 multiple-choice questions (numbered 11 to 15) with options a, b, c.
    Return ONLY a valid JSON object without markdown fences:
    {
      "sender": "Anna",
      "recipient": "Markus",
      "subject": "Email Subject",
      "text": "Lieber Markus,\nText in German (60-80 words)...\nViele Grüße,\nAnna",
      "items": [
        {"id": 11, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "a", "explanation": "Short reason"},
        {"id": 12, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "b", "explanation": "Short reason"},
        {"id": 13, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "c", "explanation": "Short reason"},
        {"id": 14, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "a", "explanation": "Short reason"},
        {"id": 15, "question": "Short question?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "b", "explanation": "Short reason"}
      ]
    }

  exam_lesen_teil4: |
    You are creating official Goethe-Zertifikat A2 Reading Exam (Lesen Teil 4) materials.
    Generate 6 short classified ads (a to f) and 5 people (16 to 20) matching ads (answer_key is 'a'-'f' or 'x' for none).
    Return ONLY a valid JSON object without markdown fences:
    {
      "title": "Anzeigen und Personen",
      "ads": [
        {"id": "a", "title": "Gitarrenunterricht", "text": "Musiklehrer gibt Gitarrenunterricht. Tel: 0176-112233"},
        {"id": "b", "title": "Yoga im Park", "text": "Yoga jeden Dienstag um 8 Uhr. Info: yoga@web.de"},
        {"id": "c", "title": "Spanischkurs", "text": "Abendkurs Spanisch A1. www.lingua.de"},
        {"id": "d", "title": "Fahrrad zu verkaufen", "text": "Citybike 7 Gänge, 90 Euro. Tel: 0151-998877"},
        {"id": "e", "title": "Möblierte Wohnung", "text": "2-Zimmer-Wohnung, 700 Euro. info@wohnen.de"},
        {"id": "f", "title": "Kochkurs Pasta", "text": "Italienischer Kochkurs am Samstag. www.kochkurs.de"}
      ],
      "items": [
        {"id": 16, "person": "Person wants Spanish course.", "answer_key": "c", "explanation": "Short reason"},
        {"id": 17, "person": "Person wants a cheap bicycle.", "answer_key": "d", "explanation": "Short reason"},
        {"id": 18, "person": "Person wants to learn cooking.", "answer_key": "f", "explanation": "Short reason"},
        {"id": 19, "person": "Person wants guitar lessons.", "answer_key": "a", "explanation": "Short reason"},
        {"id": 20, "person": "Person wants swimming lessons.", "answer_key": "x", "explanation": "Short reason"}
      ]
    }

