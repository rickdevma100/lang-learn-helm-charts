namespace: lang-learn

model:
  version: "gemma-4-e4b-q5-2026-07-28"

# ---------------------------------------------------------------------------
# MinIO (DVC remote object store)
# ---------------------------------------------------------------------------
minio:
  enabled: true
  fullnameOverride: "lang-learn-minio"

  rootUser: minioadmin
  rootPassword: minioadmin

  mode: standalone

  persistence:
    enabled: true
    size: 30Gi
    storageClass: "microk8s-hostpath"

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m

  buckets:
    - name: dvc-store
      policy: none
      purge: false

  service:
    type: ClusterIP
    port: 9000

  consoleService:
    type: ClusterIP
    port: 9001

  metrics:
    serviceMonitor:
      enabled: false

# ---------------------------------------------------------------------------
# Inference (KServe)
# ---------------------------------------------------------------------------
inference:
  image:
    repository: ghcr.io/rickdevma100/inference
    tag: latest
    pullPolicy: Always

  minReplicas: 1
  maxReplicas: 2

  scaleTarget: 1

  model:
    path: /app/models/gemma-q4/google_gemma-4-E2B-it-Q4_K_M.gguf
    dtype: bfloat16
    quantization: none
    useFlashAttention: true


  nThreads: 4

  resources:
    requests:
      memory: "8Gi"
      cpu: "2"
    limits:
      memory: "14Gi"
      cpu: "4"

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  ingressClassName: public
  inferenceHost: inference.langlearn.local

# ---------------------------------------------------------------------------
# Prompts (inlined for ConfigMap)
# ---------------------------------------------------------------------------
prompts:
  image_describe: |
    You are a German language tutor.
    Describe the image in simple German.
    Use A1 vocabulary.
    Explain difficult words in English.
  scenario_dialogue: |
    Generate a natural German conversation between exactly two people, including their English translations.

    Requirements:
    - Alternate clearly between Person A and Person B.
    - For each turn, write the German sentence first, followed immediately by its English translation on the next line starting with "Translation: ".
    - Each dialogue turn must contain at least 7 words.
    - The conversation must contain at least 18 conversational turns in total (9 turns for Person A and 9 turns for Person B).
    - Ensure the dialogue is detailed, meeting the 18-turn requirement before stopping.
    - Use simple and natural German suitable for A1-A2 level learners.
    - The dialogue should sound realistic and practical for daily life situations.
    - Keep the grammar simple and beginner-friendly.
    - Do not include explanations, notes, titles, or formatting symbols.
    - Do NOT number the turns. Do NOT put numbers before Person A or Person B.

    Specific Scenario for this conversation:
    {scenario}

    Start the conversation now:
    Person A:

  explain_word: |
    You are a German language expert. Explain the German word "{word}" for a beginner learner.

    Respond with ONLY a JSON object. Do NOT wrap it in code blocks. Do NOT add any text before or after the JSON.

    The JSON must have these fields:
    - "word": the German word
    - "part_of_speech": part of speech (include gender for nouns, e.g. "noun (feminine)")
    - "meaning": English translation and brief explanation
    - "example_sentence_german": a simple A1-A2 level German sentence using the word
    - "example_sentence_english": English translation of that sentence
    - "synonyms": array of objects with "word" (German) and "english" (English) keys, 2-3 items

    Example output format:
    {{"word": "Hund", "part_of_speech": "noun (masculine)", "meaning": "dog - a common pet animal", "example_sentence_german": "Der Hund spielt im Garten.", "example_sentence_english": "The dog plays in the garden.", "synonyms": [{{"word": "Tier", "english": "animal"}}, {{"word": "Welpe", "english": "puppy"}}]}}

    Now explain the word "{word}":

  practice_check: |
    You are a German language tutor checking a student's practice answer.

    The student is practising an {level}-level German dialogue about: "{scenario}".
    The student is writing as {speaker}.

    CONVERSATION CONTEXT (the lines just before the student's turn):
    ---
    {preceding_context}
    ---

    The EXPECTED MEANING of the student's line (in English):
    "{expected_english}"

    The STUDENT WROTE (in German):
    "{user_text}"

    Your job:
    1. Is the student's German sentence GRAMMATICALLY CORRECT for {level}-level German?
    2. Does the student's sentence FIT THE CONVERSATION CONTEXT and match the expected meaning?

    IMPORTANT RULES:
    - The student does NOT need to write the exact same sentence as the original. Any German sentence that conveys the same or very similar meaning is CORRECT.
    - Accept synonyms, alternative phrasings, and different word order if the meaning is preserved.
    - For A1-A2 level, do NOT flag informal/formal register differences as errors unless it changes the meaning.
    - Simple spelling mistakes in German (like missing umlauts) should be noted gently but not marked as grammar_ok=false.
    - If the sentence is grammatically correct and on-topic, ALWAYS return grammar_ok=true and on_topic=true. Do NOT be overly strict.

    Respond with ONLY a JSON object. No markdown, no ```, no explanation outside the JSON.
    The JSON must have exactly these fields:
    - "grammar_ok": true if the German is grammatically acceptable, false only for clear grammar errors
    - "on_topic": true if the sentence fits the conversation context and expected meaning, false only if completely unrelated
    - "feedback": a short, encouraging explanation in simple English. If correct, say "Perfect!" or praise the student. If there's an error, explain what's wrong and show the correction. Maximum 2 sentences.
    - "corrected_text": the corrected German sentence ONLY if grammar_ok is false. Set to null if grammar_ok is true.
    - "score": a number from 0.0 to 1.0. Use 1.0 for perfect, 0.8 for minor issues, 0.5 for grammar errors, 0.3 for off-topic.

    Output the JSON now:

  exam_eval_schreiben: |
    You are an official Goethe-Institut certified examiner evaluating a student's German writing exam (Goethe-Zertifikat A2 Schreiben).

    Evaluate the following submission strictly according to the official Goethe A2 evaluation criteria:

    CRITERIA:
    1. Aufgabenerfüllung (Task Fulfillment - 0 to 10 points):
       - Band A (9-10 pts): All Leitpunkte/bullet points addressed clearly and appropriately; appropriate length and format.
       - Band B (7-8 pts): Most points addressed well; minor omissions.
       - Band C (5-6 pts): Points only partially addressed or noticeable lack of clarity.
       - Band D (3-4 pts): Only 1 point addressed or mostly off-topic.
       - Band E (0-2 pts): Topic missed completely or incomprehensible.

    2. Sprache / Beherrschung (Grammar, Vocabulary & Coherence - 0 to 15 points):
       - Band A (13-15 pts): Good range of A2 vocabulary and structures; few minor grammatical or orthographical errors that do not hinder understanding.
       - Band B (10-12 pts): Adequate A2 structures; some errors in verb placement/endings/articles, but meaning is clear.
       - Band C (7-9 pts): Limited vocabulary; frequent errors that sometimes impair comprehension.
       - Band D (4-6 pts): Very simple or repetitive structures; heavy errors causing severe impairment.
       - Band E (0-3 pts): Severe and persistent errors; largely unintelligible.

    TASK PROMPT:
    Teil 1 Prompt: {teil1_prompt}
    Student Teil 1 Text:
    """
    {teil1_user_text}
    """

    Teil 2 Prompt: {teil2_prompt}
    Student Teil 2 Text:
    """
    {teil2_user_text}
    """

    Provide your evaluation as a strict JSON object matching this schema:
    {{
      "overall_score": 21.5,
      "max_score": 25.0,
      "passed": true,
      "teil1": {{
        "task_fulfillment_score": 4.5,
        "task_fulfillment_max": 5.0,
        "task_fulfillment_band": "A",
        "language_score": 6.5,
        "language_max": 7.5,
        "language_band": "B",
        "total_score": 11.0,
        "word_count": 28,
        "feedback": "Clear message addressing all points with proper informal greeting.",
        "corrections": [
          {{
            "original": "Ich komme spät weil der Bus ist kaputt.",
            "corrected": "Ich komme spät, weil der Bus kaputt ist.",
            "explanation": "Subordinate clause with 'weil' puts the conjugated verb 'ist' at the very end."
          }}
        ],
        "model_answer": "Lieber Michael, entschuldige bitte, dass ich heute 20 Minuten zu spät komme. Mein Zug hatte Verspätung. Können wir uns um 18:30 Uhr direkt vor dem Kino treffen? Bis gleich! Viele Grüße"
      }},
      "teil2": {{
        "task_fulfillment_score": 4.5,
        "task_fulfillment_max": 5.0,
        "task_fulfillment_band": "A",
        "language_score": 6.0,
        "language_max": 7.5,
        "language_band": "B",
        "total_score": 10.5,
        "word_count": 36,
        "feedback": "Polite formal tone, all four points covered adequately.",
        "corrections": [
          {{
            "original": "Können Sie mich Information schicken?",
            "corrected": "Könnten Sie mir bitte Informationen schicken?",
            "explanation": "Use dative 'mir' and plural 'Informationen' for polite requests."
          }}
        ],
        "model_answer": "Sehr geehrte Frau Weber, ich möchte im Juli gerne den Deutschkurs B1 an Ihrer Sprachschule besuchen. Wann beginnt der nächste Kurs und wie viel kostet er? Haben Sie auch Unterkünfte? Vielen Dank und freundliche Grüße"
      }},
      "general_feedback": "Overall strong A2 performance. Work on subordinate clause word order with 'weil' and 'dass'."
    }}

  exam_schreiben_teil1: |
    You are creating official Goethe-Zertifikat A2 Writing Exam (Schreiben Teil 1) materials.
    Generate a short SMS/note writing task with 3 bullet points (~20-30 words).
    Return ONLY a valid JSON object without markdown fences:
    {
      "teil": 1,
      "title": "Schreiben Teil 1: Kurze Mitteilung",
      "scenario_german": "Situation in German...",
      "instructions_german": "Schreiben Sie eine kurze Nachricht (ca. 20–30 Wörter). Schreiben Sie zu allen drei Punkten:",
      "bullet_points": [
        "Point 1 in German",
        "Point 2 in German",
        "Point 3 in German"
      ],
      "target_word_count": "20–30 Wörter",
      "tips_english": "Write a short note (approx. 20-30 words) addressing all 3 points."
    }

  exam_schreiben_teil2: |
    You are creating official Goethe-Zertifikat A2 Writing Exam (Schreiben Teil 2) materials.
    Generate a formal/semi-formal email writing task with 4 bullet points (~30-40 words).
    Return ONLY a valid JSON object without markdown fences:
    {
      "teil": 2,
      "title": "Schreiben Teil 2: Formelle E-Mail",
      "scenario_german": "Situation in German...",
      "instructions_german": "Schreiben Sie eine E-Mail (ca. 30–40 Wörter). Schreiben Sie zu allen vier Punkten:",
      "bullet_points": [
        "Point 1 in German",
        "Point 2 in German",
        "Point 3 in German",
        "Point 4 in German"
      ],
      "target_word_count": "30–40 Wörter",
      "tips_english": "Write a formal email (approx. 30-40 words) addressing all 4 points with formal greeting and sign-off."
    }

  exam_lesen_teil1: |
    You are creating official Goethe-Zertifikat A2 Reading Exam (Lesen Teil 1) materials.
    Generate an authentic, rich German newspaper/magazine article (180–220 words) with 4 structured paragraphs, character story or interview with quotes, and 5 multiple-choice questions (options a, b, c).

    Return ONLY a valid JSON object without markdown fences:
    {
      "title": "German Article Title with Subheading (e.g. Der TV-Koch Stefan Berger: »Ich versuche immer wieder etwas Neues.«)",
      "text": "Full article text in German (180–220 words) with 4 well-structured paragraphs...",
      "items": [
        {"id": 1, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "b", "explanation": "Detailed German explanation referencing specific sentence in the text."},
        {"id": 2, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "b", "explanation": "Detailed German explanation referencing specific sentence in the text."},
        {"id": 3, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "c", "explanation": "Detailed German explanation referencing specific sentence in the text."},
        {"id": 4, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "a", "explanation": "Detailed German explanation referencing specific sentence in the text."},
        {"id": 5, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "a", "explanation": "Detailed German explanation referencing specific sentence in the text."}
      ]
    }

  exam_lesen_teil2: |
    You are creating official Goethe-Zertifikat A2 Reading Exam (Lesen Teil 2) materials.
    Generate a comprehensive German department store floor directory (5–6 floors: 4. Stock, 3. Stock, 2. Stock, 1. Stock, EG, UG) with 10–15 detailed departments/items per floor, and 5 realistic customer situation questions (numbered 6 to 10) with 3 choices each (options a, b, c, where one option is often "Anderes Stockwerk").

    Return ONLY a valid JSON object without markdown fences:
    {
      "title": "Kaufhaus Alexa / City-Center Wegweiser",
      "directory": [
        {"floor": "4. Stock", "departments": "Bücher, Geschenke, Spielsachen, Freizeittaschen, Koffer, Brieftaschen, Café, Friseur, Kunden-WC"},
        {"floor": "3. Stock", "departments": "Handys, Telefone, Fernseher, Computer, Tablets, Software, Drucker, CDs, Videospiele, Sportkleidung"},
        {"floor": "2. Stock", "departments": "Herrenmode, Nachtwäsche für ihn, Möbel für Wohnzimmer, Bad und Küche, Teppiche, Lampen, Gardinen, Handtücher"},
        {"floor": "1. Stock", "departments": "Damenmode, Nachtwäsche für sie, Kindermode, Babybekleidung, Schuhe, Geschirr, Gläser, Töpfe und Pfannen"},
        {"floor": "Erdgeschoss (EG)", "departments": "Information, Uhren, Schmuck, Parfüm, Kosmetik, Schreibwaren, Reiseführer, Schlüsseldienst, Blumenladen"},
        {"floor": "Untergeschoss (UG)", "departments": "Bäcker, Supermarkt, Waschmittel, Fotoservice, Zeitschriften, Theaterkarten, Reisebüro, Geldautomat"}
      ],
      "items": [
        {"id": 6, "question": "Customer scenario in German?", "options": {"a": "1. Stock", "b": "2. Stock", "c": "Anderes Stockwerk"}, "answer_key": "a", "explanation": "Detailed explanation of which floor contains the needed item."},
        {"id": 7, "question": "Customer scenario in German?", "options": {"a": "3. Stock", "b": "Erdgeschoss", "c": "4. Stock"}, "answer_key": "a", "explanation": "Detailed explanation of which floor contains the needed item."},
        {"id": 8, "question": "Customer scenario in German?", "options": {"a": "1. Stock", "b": "4. Stock", "c": "Anderes Stockwerk"}, "answer_key": "b", "explanation": "Detailed explanation of which floor contains the needed item."},
        {"id": 9, "question": "Customer scenario in German?", "options": {"a": "2. Stock", "b": "1. Stock", "c": "Untergeschoss"}, "answer_key": "a", "explanation": "Detailed explanation of which floor contains the needed item."},
        {"id": 10, "question": "Customer scenario in German?", "options": {"a": "Erdgeschoss", "b": "3. Stock", "c": "4. Stock"}, "answer_key": "c", "explanation": "Detailed explanation of which floor contains the needed item."}
      ]
    }

  exam_lesen_teil3: |
    You are creating official Goethe-Zertifikat A2 Reading Exam (Lesen Teil 3) materials.
    Generate an authentic, rich personal German email (200–250 words) with 4–5 paragraphs describing real life situations (e.g. studying in a new city, shared flat life, language courses, daily routine, visiting plans), and 5 multiple-choice questions (numbered 11 to 15) with 3 choices each (options a, b, c).

    Return ONLY a valid JSON object without markdown fences:
    {
      "sender": "Gülcan / Anna",
      "recipient": "Sonja / Markus",
      "subject": "Neuigkeiten aus Hamburg / Meine neue Wohnung",
      "text": "Liebe Sonja,\n\nich bin jetzt schon vier Wochen in Hamburg und...\n[Full authentic email in German with 200–250 words across 4–5 paragraphs]\n\nSchreib mir bald!\nBis dann,\nGülcan",
      "items": [
        {"id": 11, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "b", "explanation": "Detailed explanation referencing specific paragraph."},
        {"id": 12, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "a", "explanation": "Detailed explanation referencing specific paragraph."},
        {"id": 13, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "c", "explanation": "Detailed explanation referencing specific paragraph."},
        {"id": 14, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "a", "explanation": "Detailed explanation referencing specific paragraph."},
        {"id": 15, "question": "Question in German?", "options": {"a": "Option A", "b": "Option B", "c": "Option C"}, "answer_key": "b", "explanation": "Detailed explanation referencing specific paragraph."}
      ]
    }

  exam_lesen_teil4: |
    You are creating official Goethe-Zertifikat A2 Reading Exam (Lesen Teil 4) materials.
    Generate 6 detailed German online classified ads/website boxes (labeled a to f) with website URLs, realistic details (opening hours, phone numbers, prices, services), and 5 specific person scenarios (numbered 16 to 20) matching one ad (answer_key is 'a', 'b', 'c', 'd', 'e', 'f', or 'x' for no matching ad).

    Return ONLY a valid JSON object without markdown fences:
    {
      "title": "Lokale und Anzeigen im Internet",
      "ads": [
        {"id": "a", "title": "www.park-cafe.de", "text": "Selbstgemachte Torten, Kuchen und italienisches Eis. Große Sonnenterrasse mit Spielplatz. Alles auch zum Mitnehmen! Täglich außer montags von 14 bis 19 Uhr geöffnet. Bergstraße 7, Tel. 08221 36152"},
        {"id": "b", "title": "www.feine-speisen.de", "text": "Egal, wo Sie feiern wollen, wir liefern für Ihre Hochzeit oder private Feiern bestes Essen. Hochzeitsmenü ab 30 € p. P. Tische, Stühle, Dekoration und Servicepersonal verfügbar."},
        {"id": "c", "title": "www.weinhaus-walter.de", "text": "Internationale Spezialitäten. Beste Weine. 3-Gänge-Menü mit Getränk ab 20 € pro Person. Im Sommer ruhiger Garten direkt hinter dem Rathaus. Schöner Raum für kleine Feiern."},
        {"id": "d", "title": "www.cafe-sand.de", "text": "Urlaub in der Stadtmitte – direkt am Fluss, täglich ab 10.00 Uhr geöffnet. Großes Frühstück am Wochenende. Samstag Party mit Live-Musik ab 22 Uhr. Tel. 785 43 65."},
        {"id": "e", "title": "www.towabu.de", "text": "Spiel + Spaß bei Towabu. Auf über 2500 qm auch bei schlechtem Wetter spielen und toben! Tolle Geburtstagspartys mit Programm. Getränke inklusive. Täglich 10 bis 20 Uhr."},
        {"id": "f", "title": "www.hansen-im-moor.de", "text": "Das Ausflugsrestaurant im Teufelsmoor. Nur 20 Minuten vom Zentrum! Norddeutsche Küche mit Terrasse am See. Räume für Familienfeste, Hochzeiten bis 150 Personen."}
      ],
      "items": [
        {"id": 16, "person": "Sarah heiratet bald und möchte mit vielen Gästen in einem Lokal feiern.", "answer_key": "f", "explanation": "Anzeige F (Hansen im Moor) bietet Räume für Hochzeiten mit bis zu 150 Personen."},
        {"id": 17, "person": "Petra will mit Geschäftspartnern in der Stadt essen gehen und über die Arbeit sprechen.", "answer_key": "c", "explanation": "Anzeige C (Weinhaus Walter) bietet ruhigen Garten und Menüs direkt hinter dem Rathaus."},
        {"id": 18, "person": "Jens feiert seinen Geburtstag zu Hause und möchte guten Wein anbieten.", "answer_key": "x", "explanation": "Keine Anzeige liefert Wein nach Hause, daher ist die Antwort 'x'."},
        {"id": 19, "person": "Karsten lädt am Abend Gäste zu sich nach Hause ein, möchte aber nicht kochen.", "answer_key": "b", "explanation": "Anzeige B (Feine Speisen) liefert Essen nach Hause für private Feiern."},
        {"id": 20, "person": "Gabriele und ihre Tochter feiern Kindergeburtstag und möchten Kuchen essen gehen.", "answer_key": "a", "explanation": "Anzeige A (Park-Café) bietet selbstgemachte Torten, Kuchen und Spielplatz."}
      ]
    }

# ---------------------------------------------------------------------------
# Monitoring (Prometheus / Grafana / AlertManager)
