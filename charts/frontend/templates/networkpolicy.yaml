apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: frontend
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic from NGINX Ingress controller and NodePort (30080)
    - ports:
        - protocol: TCP
          port: {{ .Values.frontend.port | default 3000 }}
  egress:
    # Allow BFF API calls strictly to KServe inference predictor
    - to:
        - podSelector:
            matchLabels:
              app: isvc.lang-learn-inference-predictor
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
