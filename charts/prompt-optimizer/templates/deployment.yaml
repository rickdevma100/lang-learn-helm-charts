apiVersion: apps/v1
kind: Deployment
metadata:
  name: lang-learn-prompt-optimizer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prompt-optimizer.labels" . | nindent 4 }}
spec:
  replicas: {{ if and .Values.optimizer .Values.optimizer.replicas }}{{ .Values.optimizer.replicas }}{{ else }}{{ .Values.replicaCount | default 1 }}{{ end }}
  selector:
    matchLabels:
      {{- include "prompt-optimizer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prompt-optimizer.labels" . | nindent 8 }}
    spec:
      serviceAccountName: prompt-optimizer
      containers:
        - name: prompt-optimizer
          image: "{{ if and .Values.optimizer .Values.optimizer.image }}{{ .Values.optimizer.image.repository | default .Values.image.repository }}:{{ .Values.optimizer.image.tag | default .Values.image.tag }}{{ else }}{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          ports:
            - containerPort: {{ .Values.service.port | default 8000 }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: lang-learn-prompt-optimizer-config

          env:

            # Email settings
            - name: ADMIN_EMAIL
              value: {{ .Values.email.adminEmail | quote }}
            - name: SMTP_HOST
              value: {{ .Values.email.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.email.smtpPort | quote }}
            - name: SMTP_USER
              value: {{ .Values.email.smtpUser | quote }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.email.secretName }}
                  key: {{ .Values.email.secretKey }}
                  optional: true

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}

          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: optimizer-data
              mountPath: /app/prompts
              subPath: prompts
            - name: optimizer-data
              mountPath: /app/metrics
              subPath: metrics
          {{- end }}

      {{- if .Values.persistence.enabled }}
      volumes:
        - name: optimizer-data
          persistentVolumeClaim:
            claimName: optimizer-data
      {{- end }}
