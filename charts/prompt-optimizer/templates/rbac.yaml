apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prompt-optimizer-role
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prompt-optimizer.labels" . | nindent 4 }}
rules:
  # 1. Patch only this namespace's prompts ConfigMap (to update scenario_dialogue.txt)
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["prompts"]
    verbs: ["get", "patch"]
  # 2. Required by Argo Workflows executor to report task outputs & status
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
  {{- if and .Values.legacyDeployment .Values.legacyDeployment.enabled }}
  # Legacy mode only: allow restarting inference deployment
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["lang-learn-inference-predictor"]
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prompt-optimizer-binding
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prompt-optimizer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: prompt-optimizer
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: prompt-optimizer-role
  apiGroup: rbac.authorization.k8s.io
