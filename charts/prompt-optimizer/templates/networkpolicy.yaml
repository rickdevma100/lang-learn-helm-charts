apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prompt-optimizer-netpol
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prompt-optimizer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "prompt-optimizer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Alertmanager webhook from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.port | default 8000 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: isvc.lang-learn-inference-predictor
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
    - to:
        - podSelector:
            matchLabels:
              app: mlflow-tracking
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - podSelector:
            matchLabels:
              app: redis-stack
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    # Kubernetes API Server (for patching ConfigMap/prompts) + Gmail SMTP (587)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 16443
        - protocol: TCP
          port: 587
