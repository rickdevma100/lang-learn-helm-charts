apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: school-workflow-role
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "school-silo.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: school-workflow-binding
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "school-silo.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: school-workflow-sa
    namespace: {{ .Values.namespace | default .Release.Namespace }}
roleRef:
  kind: Role
  name: school-workflow-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prompt-optimizer-role
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "school-silo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["prompts"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prompt-optimizer-binding
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "school-silo.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: prompt-optimizer
    namespace: {{ .Values.namespace | default .Release.Namespace }}
roleRef:
  kind: Role
  name: prompt-optimizer-role
  apiGroup: rbac.authorization.k8s.io
