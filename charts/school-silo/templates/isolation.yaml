apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-silo-isolation
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "school-silo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow traffic within this school's own namespace
    - from:
        - podSelector: {}
    # 2. Allow Ingress Controller, Prometheus monitoring, & Argo onboarding pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo
          podSelector:
            matchLabels:
              workflow-role: onboarder
  egress:
    # 1. Allow traffic within this school's own namespace (Frontend -> API -> Redis)
    - to:
        - podSelector: {}
    # 2. Allow calls to Shared Platform Namespace (Central Inference, MLflow, MinIO)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sharedPlatform.namespace | default "lang-learn-platform" }}
        {{- if .Values.sharedPlatform.fallbackNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sharedPlatform.fallbackNamespace }}
        {{- end }}
    # 3. Allow DNS resolution (CoreDNS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 4. External Mac LLM (:9090), Edge-TTS / K8s API (:443/:16443), SMTP (:587)
    - ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 16443
        - protocol: TCP
          port: 587
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: school-resource-quota
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "school-silo.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requestsCpu | default "2" | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | default "4Gi" | quote }}
    limits.cpu: {{ .Values.quota.limitsCpu | default "4" | quote }}
    limits.memory: {{ .Values.quota.limitsMemory | default "8Gi" | quote }}
    persistentvolumeclaims: {{ .Values.quota.pvcs | default "4" | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: school-limit-range
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "school-silo.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
