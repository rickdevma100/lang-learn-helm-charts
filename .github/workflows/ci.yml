name: Lint and Package Helm Charts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  PROJECT: rickdevma100

jobs:
  lint:
    name: Lint Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint all Helm charts
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              echo "=== Linting $chart ==="
              helm lint "$chart"
            fi
          done

  package-and-push:
    name: Package & Push OCI Charts
    needs: lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
            --username "${{ github.actor }}" --password-stdin

      - name: Package and Push Charts
        run: |
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              CHART_NAME=$(helm show chart "$chart" | grep -E "^name:" | awk '{print $2}')
              CHART_VERSION=$(helm show chart "$chart" | grep -E "^version:" | awk '{print $2}')
              echo "Packaging $CHART_NAME version $CHART_VERSION..."
              helm package "$chart" --version "$CHART_VERSION"
              helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${{ env.REGISTRY }}/${{ env.PROJECT }}/charts"
            fi
          done
